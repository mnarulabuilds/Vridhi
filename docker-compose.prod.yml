services:
  postgres:
    ports: []

  api:
    environment:
      NODE_ENV: production
    ports:
      - "${API_BIND:-0.0.0.0}:${PORT:-3001}:3001"

  caddy:
    profiles: ["tls"]
    image: caddy:2-alpine
    container_name: vridhi-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
    name: vridhi_postgres_prod
  caddy_data:
  caddy_config:
