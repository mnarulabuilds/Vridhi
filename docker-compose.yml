services:
  postgres:
    image: postgres:17-alpine
    container_name: vridhi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vridhi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vridhi"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    container_name: vridhi-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vridhi?schema=public
      JWT_SECRET: replace-with-a-long-random-secret
      JWT_ACCESS_TOKEN_EXPIRY: 15m
      JWT_REFRESH_TOKEN_EXPIRY_DAYS: 30
      PORT: 3001
      CORS_ORIGINS: http://localhost:8081
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: gpt-4o-mini
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
