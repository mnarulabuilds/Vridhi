# Render Blueprint: API + Postgres.
# Dashboard: New → Blueprint → this repo.
# Or set the same env vars on an existing Web Service (see QUICKSTART).

databases:
  - name: vridhi-db
    databaseName: vridhi
    user: vridhi
    postgresMajorVersion: "17"

services:
  - type: web
    name: vridhi-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vridhi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRY
        value: 15m
      - key: JWT_REFRESH_TOKEN_EXPIRY_DAYS
        value: "30"
      - key: CORS_ORIGINS
        value: ""
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-4o-mini
